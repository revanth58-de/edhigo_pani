<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DINASARI — Splash & Login Transition</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/SplashScreen.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      background-color: #dbe4d5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 20px 0;
    }
    .preview-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99999;
      background: rgba(27, 67, 20, 0.95);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 13px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .preview-bar button {
      background: #589a2d;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 18px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <div class="preview-bar">
    <span>DINASARI Splash ➔ Login</span>
    <button onclick="window.location.reload()">Replay Animation</button>
  </div>

  <script type="text/babel">
    const dinasariLogo = './src/assets/image.png';

    function DinasariSplashAndLogin() {
      const [phase, setPhase] = React.useState('splash');
      const [showPassword, setShowPassword] = React.useState(false);
      const [keepSignedIn, setKeepSignedIn] = React.useState(true);

      React.useEffect(() => {
        const exitTimer = setTimeout(() => {
          setPhase('exit');
        }, 2000);

        const loginTimer = setTimeout(() => {
          setPhase('login');
        }, 2600);

        return () => {
          clearTimeout(exitTimer);
          clearTimeout(loginTimer);
        };
      }, []);

      if (phase === 'splash' || phase === 'exit') {
        return (
          <div className="splash-screen">
            <div className={`splash-content ${phase === 'exit' ? 'slide-out' : 'animate-in'}`}>
              <div className="logo-wrapper">
                <img
                  src={dinasariLogo}
                  alt="DINASARI Logo"
                  className="dinasari-logo-img"
                />
              </div>
              <p className="dinasari-tagline">
                Connect Collaborate Cultivate
              </p>
            </div>
          </div>
        );
      }

      return (
        <div className="login-screen">
          <div className="header-banner">
            <div className="header-text">
              <h1 className="header-brand">DINASARI</h1>
              <p className="header-subtitle">
                Connect Collaborate<br />Cultivate
              </p>
            </div>
            <div className="header-illustration">
              <img
                src={dinasariLogo}
                alt="DINASARI"
                className="header-logo-img"
              />
            </div>
          </div>

          <div className="login-form-container">
            <h2 className="welcome-title">Welcome Back</h2>

            <div className="input-group">
              <span className="input-icon">✉️</span>
              <input
                type="text"
                placeholder="Email or phone"
                className="form-input"
              />
            </div>

            <div className="input-group">
              <span className="input-icon">🔒</span>
              <input
                type={showPassword ? 'text' : 'password'}
                placeholder="Password"
                className="form-input"
              />
              <button
                type="button"
                className="eye-btn"
                onClick={() => setShowPassword(!showPassword)}
              >
                {showPassword ? '🙈' : '👁️'}
              </button>
            </div>

            <div className="form-options">
              <label className="checkbox-label">
                <input
                  type="checkbox"
                  checked={keepSignedIn}
                  onChange={(e) => setKeepSignedIn(e.target.checked)}
                />
                <span className="custom-checkbox"></span>
                Keep me signed in
              </label>
              <a href="#forgot" className="forgot-link">Forgot Password?</a>
            </div>

            <button type="button" className="login-btn">
              Log In
            </button>

            <div className="divider">
              <span>Or continue with</span>
            </div>

            <div className="social-buttons">
              <button type="button" className="social-btn">
                <span className="social-icon">G</span> Google
              </button>
              <button type="button" className="social-btn">
                <span className="social-icon"></span> Apple
              </button>
            </div>

            <p className="signup-prompt">
              Don't have an account? <a href="#signup">Sign Up</a>
            </p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<DinasariSplashAndLogin />);
  </script>
</body>
</html>
